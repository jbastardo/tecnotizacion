services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tecnotizar-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://tecnotizacion:${POSTGRES_PASSWORD}@postgres:5432/tecnotizacion
      - DATABASE_SSL=false
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://tecnotizar.tutecnotienda.site}
      - API_KEY=${API_KEY:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: tecnotizar-db
    environment:
      POSTGRES_USER: tecnotizacion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tecnotizacion
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./lib/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tecnotizacion -d tecnotizacion"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: tecnotizar-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
